<style>
:root{
  --bg1:#f6f1e7; --bg2:#e9e0d2; --ink:#3f3a33; --sub:#8a8174;
  --card:#ffffffcc; --line:#00000014; --accent:#6b6255;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,#e2d6c3 100%);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:40px 20px 60px;
}
.wrap{width:100%;max-width:1040px}
header{text-align:center;margin-bottom:44px}
.logo{
  width:72px;height:72px;border-radius:18px;margin:0 auto 16px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 10px 28px rgba(80,70,55,.14), inset 0 1px 0 rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.6);
}
.logo img{width:52px;height:52px;image-rendering:pixelated}
h1{font-size:30px;font-weight:700;letter-spacing:.5px}
.sub{margin-top:10px;font-size:15px;color:var(--sub)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{
  position:relative;display:block;text-decoration:none;color:var(--ink);
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.65);border-radius:20px;
  padding:30px 26px 26px;
  box-shadow:0 12px 32px rgba(80,70,55,.12), inset 0 1px 0 rgba(255,255,255,.75);
  transition:transform .22s ease, box-shadow .22s ease;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,rgba(107,98,85,.55),rgba(107,98,85,.1));
  opacity:0;transition:opacity .22s;
}
.card:hover{transform:translateY(-5px);box-shadow:0 20px 44px rgba(80,70,55,.18)}
.card:hover::before{opacity:1}
.ic{
  width:52px;height:52px;border-radius:14px;margin-bottom:18px;
  background:linear-gradient(145deg,#f0e8da,#e4d8c6);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.6);
}
.ic svg{width:28px;height:28px;stroke:var(--accent)}
.card h2{font-size:19px;font-weight:700;margin-bottom:10px}
.card p{font-size:14px;line-height:1.7;color:var(--sub)}
.card p.note{margin-top:8px;font-size:12.5px;color:#9c9284}
.go{
  display:inline-flex;align-items:center;gap:6px;margin-top:18px;
  font-size:13.5px;font-weight:600;color:var(--accent);
}
.go svg{width:14px;height:14px;stroke:var(--accent)}
footer{margin-top:56px;font-size:12.5px;color:#b0a696}
@media (max-width:820px){
  .cards{grid-template-columns:1fr}
  h1{font-size:24px}
}
</style>
</head>
